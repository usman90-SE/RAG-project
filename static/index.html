<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAG Assistant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
        }
        h1 { color: #333; }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #45a049; }
        #answer-box {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            min-height: 50px;
        }
        .upload-section {
            margin-bottom: 20px; 
            padding: 15px; 
            background: white; 
            border: 1px solid #ddd; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>RAG Document Assistant</h1>

    <!-- Day 2: PDF Upload Section -->
    <div class="upload-section">
        <h3>Upload Document</h3>
        <input type="file" id="pdf-file" accept=".pdf">
        <button onclick="uploadPDF()">Upload PDF</button>
        <p id="upload-status" style="color: green;"></p>
    </div>

    <!-- Day 1: Question and Answer Section -->
    <textarea id="question" placeholder="Ask a question about your document..."></textarea>
    <button onclick="askQuestion()">Ask</button>
    <div id="answer-box">Answer will appear here...</div>

    <script>
        // Day 2: Upload PDF Function
        async function uploadPDF() {
            const fileInput = document.getElementById("pdf-file");
            const status = document.getElementById("upload-status");

            if (!fileInput.files[0]) {
                status.innerText = "Please select a PDF file first.";
                status.style.color = "red";
                return;
            }

            status.innerText = "Uploading...";
            status.style.color = "black";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            // Using relative URL as per Day 3
            const response = await fetch("/ingest", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            status.innerText = data.message || "Upload complete!";
            status.style.color = "green";
        }

        // Day 1: Ask Question Function
        async function askQuestion() {
            const question = document.getElementById("question").value;
            const answerBox = document.getElementById("answer-box");

            if (!question.trim()) {
                answerBox.innerText = "Please enter a question.";
                return;
            }

            answerBox.innerText = "Loading...";

            // Using relative URL as per Day 3
            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: question })
            });

            const data = await response.json();
            answerBox.innerText = data.answer;
        }
    </script>
</body>
</html>
